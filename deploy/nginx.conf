# Production nginx site for duncanbd.com (behind Cloudflare, Full (Strict) with an origin certificate).
# Root is the release symlink so deploys switch atomically (see deploy/deploy.sh).

# Per-IP request limits for the endpoints attackers hammer (Laravel also rate-limits; this stops it earlier).
limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=forms:10m rate=20r/m;

server {
    listen 80;
    server_name duncanbd.com www.duncanbd.com;
    return 301 https://duncanbd.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name duncanbd.com;

    ssl_certificate     /etc/ssl/duncanbd/origin.pem;
    ssl_certificate_key /etc/ssl/duncanbd/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/duncanbd/current/public;
    index index.php;
    server_tokens off;
    client_max_body_size 55m;               # documents are limited to 50 MB by the app

    # Cloudflare: restore the real client IP (and set Laravel's trusted proxies accordingly).
    # include /etc/nginx/cloudflare-realip.conf;

    # Security headers. "always" so they also appear on error responses and on static files,
    # which the PHP application never sees. Keep in sync with app/Http/Middleware/SecurityHeaders.php.
    # (The app sets the same headers with set(), so remove these lines if you prefer a single source.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets never change: cache for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        try_files $uri =404;
    }

    # Uploaded media (public disk via the storage symlink).
    location /storage/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;   # an uploaded file can never run as a page
        try_files $uri =404;
    }

    # Brute-force protection in front of PHP.
    location ~ ^/(login|forgot-password|reset-password|two-factor-challenge|user/confirm-password)$ {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/(contact|newsletter|careers/vacancies/[^/]+/apply)$ {
        limit_req zone=forms burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;   # $realpath_root: OPcache + symlink releases
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Never serve dotfiles, VCS data or anything outside public/ (the document root already excludes them).
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|zip|bak|log|env)$ { deny all; }
}
