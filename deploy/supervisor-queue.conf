; Queue worker for emails and image conversions. Install as /etc/supervisor/conf.d/duncanbd-queue.conf
[program:duncanbd-queue]
command=php /var/www/duncanbd/current/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/duncanbd-queue.log
